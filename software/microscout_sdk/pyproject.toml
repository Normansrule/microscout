# STATUS: DRAFT - UNVERIFIED - requires human review at Gate G1 (rev B)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscout"
version = "0.1.0.dev0"
description = "Python SDK and flight simulator for the MicroScout open-source micro drone (draft, pre-hardware)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
control = ["scipy>=1.8"]
dev = ["pytest>=7", "matplotlib>=3.5", "scipy>=1.8"]

[project.scripts]
microscout = "microscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
