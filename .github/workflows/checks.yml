# STATUS: DRAFT - UNVERIFIED - requires human review at Gate G1 (rev B)
# Runs the simulator test suite and the G1 consistency checks on every push.
name: checks
on:
  push:
  pull_request:
jobs:
  sdk-and-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: pip install -e "software/microscout_sdk[dev]"
      - name: Simulator tests
        run: cd software/microscout_sdk && pytest -q
      - name: G1 budget regenerates without changes
        run: |
          python3 review/G1/calc/budgets.py
          git diff --exit-code review/G1/budgets.md
      - name: Pin table check
        run: python3 review/G1/calc/check_pins.py
